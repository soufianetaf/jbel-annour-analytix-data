# ════════════════════════════════════════════════════════════════
#  Projet dbt de Jbel Annour Analytix
# ════════════════════════════════════════════════════════════════
#  Lancer depuis le dossier dbt/, avec les variables du .env :
#    cd dbt
#    uv run --env-file ../.env dbt build
# ════════════════════════════════════════════════════════════════

name: analytix
version: "0.1.0"
config-version: 2
profile: analytix

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

vars:
  # Type de pièce de clôture de Sage X3 : une pièce par exercice, au 31/12,
  # qui solde les comptes 6 et 7. Exclue du compte de résultat.
  # Attention : le JOURNAL J42 n'est pas un journal de clôture (il contient
  # aussi des opérations diverses et des amortissements toute l'année).
  type_piece_cloture: CLOS1
  # Tarif de l'énergie réactive excédentaire (MAD par kvarh), contrat du distributeur.
  # Vide tant qu'il n'est pas connu : la pénalité de cos φ estimée reste vide.
  tarif_energie_reactive_mad_kvarh: null
  # Compte PostgreSQL de l'API : la sécurité par ligne le filtre (macro securite_par_ligne)
  role_api: analytix_api

clean-targets: ["target", "dbt_packages"]

flags:
  # Un test en échec arrête la construction des modèles qui en dépendent
  fail_fast: false

models:
  analytix:
    # Chaque couche va dans son schéma (créé par infra.postgres.initialiser_entrepot)
    staging:
      +schema: staging
      # Vues : toujours le reflet exact de raw, rien à recalculer
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    # Photos périodiques des états que Sage X3 ne garde pas (stock, créances…)
    snapshots:
      +schema: snapshots

# Qualité des données (docs/indicateurs/qualite_donnees.md) : les lignes en
# erreur des tests marqués store_failures sont gardées dans ce schéma, une
# table par test, remplacée à chaque contrôle
data_tests:
  analytix:
    +schema: qualite_donnees

# Historique des résultats de tests : table créée au début, remplie à la fin
on-run-start:
  - "{{ creer_historique_qualite() }}"
on-run-end:
  - "{{ enregistrer_resultats_tests(results) }}"
