version: 2

models:
  - name: stg_x3__factures
    description: >
      Documents de vente de Sage X3 (factures, avoirs, pro forma), nettoyés.
      Grain : une ligne = un document. Montants positifs ; le signe est dans « signe ».
    columns:
      - name: numero_facture
        description: Numéro du document (NUM_0). Clé.
        data_tests:
          - unique
          - not_null
      - name: type_facture
        description: "FAC facture, AVF / AVR avoir, PRF pro forma (SIVTYP_0)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FAC", "AVF", "AVR", "PRF"]
      - name: signe
        description: "1 pour une facture, -1 pour un avoir (SNS_0)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
      - name: societe
        description: Société Sage X3 (CPY_0). 100 = Jbel Annour.
        data_tests:
          - not_null
      - name: site
        description: Site de vente (FCY_0). 101 usine, 102 négoce…
        data_tests:
          - not_null
      - name: client
        description: Code du client (BPR_0).
        data_tests:
          - not_null
      - name: date_comptable
        description: Date comptable du document (ACCDAT_0).
        data_tests:
          - not_null
      - name: devise
        description: Devise du document (CUR_0).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["MAD"]
              # Une autre devise n'est pas une erreur, mais doit être vue
              config:
                severity: warn
      - name: montant_ht
        description: Montant hors taxes, positif (AMTNOT_0).
        data_tests:
          - not_null
      - name: montant_ttc
        description: Montant toutes taxes comprises, positif (AMTATI_0).
        data_tests:
          - not_null

  - name: stg_x3__lignes_facture
    description: >
      Lignes des documents de vente de Sage X3, nettoyées.
      Grain : une ligne = une ligne de document. Montants positifs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["numero_facture", "numero_ligne"]
    columns:
      - name: numero_facture
        description: Numéro du document (NUM_0).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_x3__factures')
                field: numero_facture
      - name: numero_ligne
        description: Numéro de la ligne dans le document (SIDLIN_0).
        data_tests:
          - not_null
      - name: article
        description: Code article (ITMREF_0).
        data_tests:
          - not_null
      - name: representant
        description: Représentant principal (REP1_0). Sert au filtre par représentant.
        data_tests:
          - not_null:
              # 63 lignes sans représentant au profilage : à suivre, pas bloquant
              config:
                severity: warn
      - name: quantite
        description: Quantité en unité de vente (QTY_0).
        data_tests:
          - not_null
      - name: montant_ht
        description: Montant hors taxes de la ligne, positif (AMTNOTLIN_0).
        data_tests:
          - not_null
      - name: montant_ttc
        description: Montant TTC de la ligne, positif (AMTATILIN_0).
        data_tests:
          - not_null

  - name: stg_x3__clients
    description: >
      Fiches clients de Sage X3, nettoyées. Grain : une ligne = un client.
      Copiées en liste fermée : ni CIN, ni banque, ni données financières maison.
    columns:
      - name: code_client
        description: Code client (BPCNUM_0). Clé.
        data_tests:
          - unique
          - not_null
      - name: nom_client
        description: Raison sociale (BPCNAM_0). 244 noms sont présents plusieurs fois.
        data_tests:
          - not_null:
              # 9 fiches sans nom au 25/11/2026, toutes inactives et sans vente :
              # anomalie à corriger dans X3 par l'ADV, pas bloquante
              config:
                severity: warn
      - name: representant
        description: Représentant principal de la fiche client (REP_0).

  - name: stg_x3__articles
    description: >
      Fiches articles de Sage X3, nettoyées. Grain : une ligne = un article.
    columns:
      - name: code_article
        description: Code article (ITMREF_0). Clé.
        data_tests:
          - unique
          - not_null
      - name: designation
        description: Désignation (ITMDES1_0).
        data_tests:
          - not_null
      - name: poids_unitaire
        description: Poids d'une unité de stock, dans unite_poids. Vide si non renseigné (0 dans X3).

  - name: stg_x3__echeances
    description: >
      Échéances de Sage X3 (clients et fournisseurs), nettoyées.
      Grain : une ligne = une échéance. Montants positifs, sens dans « signe ».
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [type_piece, numero_piece, ligne_piece, numero_echeance]
    columns:
      - name: code_type_tiers
        description: "1 client, 2 fournisseur (BPRTYP_0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: tiers
        data_tests: [not_null]
      - name: date_echeance
        data_tests: [not_null]
      - name: signe
        description: "1 ou -1 (SNS_0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
      - name: montant
        description: Montant de l'échéance en MAD (AMTLOC_0), positif.
        data_tests: [not_null]
      - name: paye
        description: Montant déjà payé en MAD (PAYLOC_0).
        data_tests: [not_null]
      - name: code_lettrage
        description: "1 non lettrée, 2 lettrée (FLGCLE_0)."

  - name: stg_x3__lignes_ecriture
    description: >
      Lignes d'écritures de Sage X3, nettoyées, sans libellé ni nom de tiers.
      Grain : une ligne = une ligne d'écriture dans un registre.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [type_piece, numero_piece, ligne, registre]
    columns:
      - name: registre
        description: "1 comptabilité générale, 2 analytique (LEDTYP_0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: compte
        data_tests: [not_null]
      - name: sens
        description: "1 débit, -1 crédit (SNS_0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
      - name: montant
        description: Montant en MAD (AMTLED_0), positif.
        data_tests: [not_null]
      - name: date_comptable
        data_tests: [not_null]

  - name: stg_x3__ecritures
    description: "Entêtes d'écritures de Sage X3. Grain : une ligne = une pièce."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [type_piece, numero_piece]
    columns:
      - name: code_categorie
        description: "1 réelle ; 2 et 3 à confirmer (simulation, provisoire)."
        data_tests: [not_null]

  - name: stg_x3__comptes
    description: "Plan comptable de Sage X3. Grain : une ligne = un compte d'un plan."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [plan_comptable, compte]

  - name: stg_x3__exercices
    description: "Exercices comptables de Sage X3. Grain : un exercice d'une société dans un registre."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [societe, registre, numero_exercice]

  - name: stg_x3__reglements
    description: "Règlements de Sage X3, sans RIB ni coordonnées du tiers. Grain : un règlement."
    columns:
      - name: numero_reglement
        data_tests: [unique, not_null]
      - name: code_sens
        description: "2 encaissement, 1 décaissement (SNS_0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

  - name: stg_x3__stock_articles
    description: "Stock et CMUP par article × site, état actuel. Grain : un article sur un site."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [article, site]
    columns:
      - name: article
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_x3__articles')
                field: code_article
      - name: cmup
        description: Coût moyen unitaire pondéré (AVC_0).
        data_tests: [not_null]

  - name: stg_x3__mouvements_stock
    description: "Mouvements de stock de Sage X3. Grain : un mouvement d'un article sur un site."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [site, code_mise_a_jour, article, date_mouvement, sequence, indice]
    columns:
      - name: article
        data_tests: [not_null]
      - name: date_mouvement
        data_tests: [not_null]
      - name: quantite
        description: Quantité en unité de stock, positive à l'entrée, négative à la sortie.
        data_tests: [not_null]

  - name: stg_x3__demandes_achat
    description: "Demandes d'achat de Sage X3. Grain : une demande."
    columns:
      - name: numero_demande
        data_tests: [unique, not_null]
      - name: date_demande
        data_tests: [not_null]

  - name: stg_x3__lignes_demande_achat
    description: "Lignes de demandes d'achat. Grain : une ligne de demande."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [numero_demande, ligne]
    columns:
      - name: numero_demande
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_x3__demandes_achat')
                field: numero_demande

  - name: stg_x3__liens_demande_commande
    description: "Lien ligne de DA → ligne de commande (PREQUISO). Grain : un lien."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [numero_demande, ligne_demande, numero_commande, ligne_commande, sequence_commande]

  - name: stg_x3__commandes_achat
    description: "Commandes fournisseurs. Grain : une commande."
    columns:
      - name: numero_commande
        data_tests: [unique, not_null]
      - name: fournisseur
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_x3__fournisseurs')
                field: code_fournisseur

  - name: stg_x3__lignes_commande_achat
    description: "Lignes de commandes fournisseurs. Grain : une ligne × une échéance de livraison."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [numero_commande, ligne, sequence]
    columns:
      - name: numero_commande
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_x3__commandes_achat')
                field: numero_commande

  - name: stg_x3__lignes_reception
    description: "Lignes de réceptions fournisseurs. Grain : une ligne de réception."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [numero_reception, ligne]

  - name: stg_x3__factures_fournisseurs
    description: "Factures et avoirs fournisseurs. Grain : un document."
    columns:
      - name: numero_facture
        data_tests: [unique, not_null]
      - name: signe
        data_tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false

  - name: stg_x3__lignes_facture_fournisseur
    description: "Lignes de factures fournisseurs. Grain : une ligne de document."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [numero_facture, ligne]
    columns:
      - name: numero_facture
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_x3__factures_fournisseurs')
                field: numero_facture

  - name: stg_x3__fournisseurs
    description: "Fournisseurs de Sage X3, sans banque. Grain : un fournisseur."
    columns:
      - name: code_fournisseur
        data_tests: [unique, not_null]
