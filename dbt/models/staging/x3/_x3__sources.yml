version: 2

sources:
  - name: x3
    description: >
      Copie fidèle de Sage X3, dossier BASE1, chargée par ingestion.x3_ventes
      (lecture seule, sans verrou). Jamais modifiée à la main.
    schema: raw_x3
    loaded_at_field: _charge_le
    # Alerte si la copie n'a pas été rafraîchie
    freshness:
      warn_after: {count: 4, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: sinvoice
        description: Entêtes de factures et d'avoirs clients (SINVOICE). Une ligne par document.
      - name: sinvoiced
        description: Lignes de factures et d'avoirs clients (SINVOICED). Une ligne par ligne de document.
      - name: bpcustomer
        description: Fiches clients (BPCUSTOMER), en liste fermée de colonnes. Une ligne par client.
      - name: itmmaster
        description: Fiches articles (ITMMASTER), en liste fermée de colonnes. Une ligne par article.
      - name: gaccdudate
        description: >
          Échéances clients et fournisseurs (GACCDUDATE), en liste fermée.
          Copie incrémentale sur UPDDATTIM_0, complète chaque semaine.
          Une ligne par échéance d'une pièce comptable.
      - name: gaccentryd
        description: >
          Lignes d'écritures comptables (GACCENTRYD), en liste fermée, sans
          libellé ni nom de tiers. Incrémental sur UPDDATTIM_0.
      - name: gaccentry
        description: Entêtes d'écritures comptables (GACCENTRY), en liste fermée. Incrémental.
      - name: gaccount
        description: Plan comptable (GACCOUNT), en liste fermée.
      - name: fiscalyear
        description: Exercices comptables (FISCALYEAR).
      - name: paymenth
        description: Règlements (PAYMENTH), en liste fermée, sans RIB ni coordonnées du tiers.
      - name: itmmvt
        description: Stock et coût moyen par article × site (ITMMVT), état actuel, en liste fermée.
      - name: stojou
        description: >
          Journal des mouvements de stock (STOJOU), en liste fermée, sans libellé
          ni champs libres. Incrémental sur UPDDATTIM_0.
      - name: prequis
        description: "Entêtes de demandes d'achat (PREQUIS), en liste fermée."
      - name: prequisd
        description: "Lignes de demandes d'achat (PREQUISD), en liste fermée."
      - name: prequiso
        description: "Lien ligne de demande d'achat → ligne de commande (PREQUISO)."
      - name: porder
        description: "Entêtes de commandes fournisseurs (PORDER), sans nom ni adresse."
      - name: porderq
        description: "Lignes de commandes fournisseurs (PORDERQ), en liste fermée."
      - name: preceiptd
        description: "Lignes de réceptions fournisseurs (PRECEIPTD), en liste fermée."
      - name: pinvoice
        description: "Entêtes de factures fournisseurs (PINVOICE), sans nom ni adresse."
      - name: pinvoiced
        description: "Lignes de factures fournisseurs (PINVOICED), en liste fermée."
      - name: bpsupplier
        description: "Fiches fournisseurs (BPSUPPLIER), sans banque."
