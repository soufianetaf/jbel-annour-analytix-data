# ════════════════════════════════════════════════════════════════
#  Intégration continue (CI)
# ════════════════════════════════════════════════════════════════
#  Se lance à chaque push sur dev (branche de travail) et à chaque
#  pull request dev → main. La pull request vers main ne peut être
#  fusionnée que si tous les contrôles sont verts (protection de main).
#
#  Le détail et la raison de chaque contrôle : docs/ci-cd.md
#
#  Les contrôles s'ajoutent au fil des étapes du projet :
#    - étape 1     : sécurité du dépôt (fichiers interdits, secrets)
#    - étape 2     : dépendances figées (uv), style (ruff), tests (pytest)
#    - étape 3     : initialisation de l'entrepôt et droits des comptes
#    - dbt         : compilation, tests, tests unitaires
#    - API         : tests d'accès par rôle
# ════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]

# Droits minimaux : la CI lit le code, elle n'écrit rien.
permissions:
  contents: read

# Si on pousse deux fois de suite sur la même branche, on annule
# l'exécution précédente au lieu de les faire tourner toutes les deux.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Fichiers interdits ─────────────────────────────────────
  verifier-depot:
    name: Fichiers interdits
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le contenu du dépôt
        run: python infra/ci/verifier_depot.py

  # ─── 2. Secrets dans le code et l'historique ───────────────────
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Récupérer le code avec tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # un secret supprimé reste dans l'historique : on le cherche aussi

      - name: Installer gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Chercher des secrets
        # --redact : la valeur trouvée n'est jamais affichée dans les journaux
        run: gitleaks git --redact --verbose .

  # ─── 3. Code Python : dépendances, style, tests ────────────────
  python:
    name: Code Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer Python et les dépendances figées
        # --locked : échoue si uv.lock ne correspond plus à pyproject.toml
        run: uv sync --locked

      - name: Style et erreurs courantes (ruff check)
        run: uv run ruff check --output-format=github

      - name: Mise en forme (ruff format)
        run: uv run ruff format --check

      - name: Tests unitaires (pytest)
        run: uv run pytest

  # ─── 4. Entrepôt : initialisation et droits sur un vrai PostgreSQL ─
  entrepot:
    name: Entrepôt PostgreSQL
    runs-on: ubuntu-latest
    # PostgreSQL 16 jetable, créé pour ce job puis détruit. Les mots de
    # passe ci-dessous n'existent que dans ce conteneur : aucun secret réel.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: admin-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANALYTIX_TEST_ENTREPOT: "1"
      DW_HOST: localhost
      DW_PORT: "5432"
      DW_DATABASE: dw_test
      DW_ADMIN_USER: postgres
      DW_ADMIN_PASSWORD: admin-ci
      DW_PASSWORD: chargeur-ci
      API_DB_PASSWORD: api-ci
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer Python et les dépendances figées
        run: uv sync --locked

      - name: Initialiser l'entrepôt et tester les droits de chaque compte
        run: uv run pytest -m entrepot -v
