[project]
name = "jbel-annour-analytix-data"
version = "0.1.0"
description = "Data warehouse et API de Jbel Annour Analytix"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Transformations et tests SQL (staging, intermediate, marts).
    # dbt Core 1.x : la v2 est un autre moteur, à évaluer séparément.
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
    # Ingestion : copie des tables sources vers la couche raw de l'entrepôt
    "dlt[postgres,sql-database]>=1.5",
    # Connexion à l'entrepôt PostgreSQL (le même pilote que dbt et dlt)
    "psycopg2-binary>=2.9",
    # Lecture des variables du fichier .env, avec contrôle des types
    "pydantic-settings>=2.6",
    # Connexion aux bases SQL Server (Sage X3, JBELRH, usine)
    "pyodbc>=5.2",
    # API : FastAPI, servie par uvicorn
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # API : connexions à l'entrepôt en lecture seule, avec un pool
    "psycopg[binary,pool]>=3.2",
    # API : mots de passe hachés (Argon2), jetons de connexion (JWT),
    # formulaire de connexion (OAuth2)
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
]

[dependency-groups]
# Outils du développeur et de la CI, jamais installés en production
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

# ─── ruff : style et erreurs courantes ─────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # style PEP 8
    "F",       # erreurs : variable inutilisée, import manquant…
    "I",       # ordre des imports
    "UP",      # syntaxe Python moderne
    "B",       # pièges courants (bugbear)
    "SIM",     # simplifications
]

# ─── pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Avertissement de dépendance (starlette) sans effet sur les tests de l'API
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "entrepot: tests sur un vrai PostgreSQL de test (dw_test), lancés par la CI",
]
